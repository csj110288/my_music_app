<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Musician Copy & Studio App</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4facfe">

  <!-- Wavesurfer.js & Regions Plugin -->
  <script src="https://unpkg.com/wavesurfer.js@7"></script>
  <script src="https://unpkg.com/wavesurfer.js@7/dist/plugins/regions.min.js"></script>

  <!-- Tone.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #121212; color: #ffffff; margin: 0; padding: 16px; text-align: center; }
    .container { max-width: 850px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    h1 { font-size: 1.5rem; color: #4facfe; margin-bottom: 16px; }
    
    .controls-main { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 16px; }
    
    /* 데스크톱/모바일 반응형 비디오 모니터 박스 */
    .video-preview-box {
      display: none;
      width: 100%;
      height: 400px;
      margin: 0 auto 12px auto;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #333;
      position: relative;
      cursor: grab;
    }
    .video-preview-box:active { cursor: grabbing; }
    
    .video-preview-box video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transform-origin: center center;
      transition: transform 0.05s ease-out;
    }

    @media (max-width: 600px) {
      .video-preview-box { height: 230px; }
      body { padding: 8px; }
      .container { padding: 12px; }
    }

    /* 파형 콘솔 및 전용 Zoom 컨트롤 박스 */
    .waveform-section {
      background: #252528;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 16px;
      border: 1px solid #333;
    }
    #waveform { background: #1a1a1a; border-radius: 8px; min-height: 80px; overflow: hidden; position: relative; }

    .slider-panel {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 12px;
      background: #282828;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 16px;
    }
    .slider-group { display: flex; flex-direction: column; align-items: stretch; text-align: left; }
    .slider-header { display: flex; justify-content: space-between; font-weight: bold; font-size: 0.9rem; margin-bottom: 6px; color: #4facfe; }
    .slider-header span.val { color: #00f2fe; }
    
    .key-display-box {
      background: #121212;
      border: 1px solid #4facfe;
      border-radius: 8px;
      padding: 8px;
      margin-top: 6px;
      text-align: center;
    }
    .key-title { font-size: 0.75rem; color: #aaa; margin-bottom: 2px; }
    .key-result { font-size: 1.1rem; font-weight: bold; color: #00f2fe; }

    select {
      background: #333; color: #fff; border: 1px solid #555; padding: 4px 8px; border-radius: 6px; font-weight: bold;
    }

    input[type="range"] {
      width: 100%; height: 6px; border-radius: 3px; background: #444; outline: none; accent-color: #00f2fe; cursor: pointer;
    }

    button, input[type="file"]::file-selector-button {
      background: linear-gradient(to right, #4facfe, #00f2fe);
      border: none; color: #000; font-weight: bold; padding: 8px 14px;
      border-radius: 8px; cursor: pointer; transition: 0.2s; font-size: 0.9rem;
    }
    button.secondary { background: #333; color: #fff; border: 1px solid #555; }
    button.record-btn { background: linear-gradient(to right, #ff007f, #7f00ff); color: #fff; }
    button:hover { opacity: 0.9; transform: translateY(-1px); }
    .status { font-size: 0.88rem; color: #00f2fe; margin-top: 6px; font-weight: bold; word-break: break-all; }
  </style>
</head>
<body>

  <div class="container">
    <h1>🎸 Musician Copy & Studio App</h1>

    <div class="controls-main">
      <input type="file" id="audio-file" accept="audio/*,video/*">
      <button id="btn-play">재생 / 일시정지</button>
      <button id="btn-clear-loop" class="secondary">구간 해제</button>
      <button id="btn-record" class="record-btn">🎥 영상 녹화 시작</button>
    </div>

    <!-- 영상 모니터 및 영상 줌 슬라이더 -->
    <div class="video-preview-box" id="video-container">
      <video id="media-engine"></video>
    </div>

    <div id="video-zoom-panel" style="display:none; margin-bottom: 12px; background: #282828; padding: 10px 16px; border-radius: 8px;">
      <div class="slider-header">
        <span>Video Zoom (영상 화면 확대/위치 이동)</span>
        <span class="val" id="video-zoom-val">1.0x (기본 크기)</span>
      </div>
      <input type="range" id="slider-video-zoom" min="1.0" max="2.5" step="0.1" value="1.0">
      <div style="font-size: 0.75rem; color: #aaa; margin-top: 4px; text-align: left;">* 화면을 확대 후 마우스/손가락으로 마구 끌어서 원하는 연주 지점을 맞춰보세요.</div>
    </div>

    <!-- 파형 콘솔 + 파형 Zoom 슬라이더 세트 -->
    <div class="waveform-section">
      <div id="waveform"></div>
      
      <div class="slider-group" style="margin-top: 10px;">
        <div class="slider-header">
          <span>Waveform Zoom (파형 정밀 확대)</span>
          <span class="val" id="zoom-val">기본 크기</span>
        </div>
        <input type="range" id="slider-zoom" min="0" max="150" step="5" value="0">
      </div>
      <div class="status" id="status-text">음원 또는 영상 파일(MP3, MP4, WebM 등)을 선택하세요.</div>
    </div>

    <!-- 속도/키 컨트롤 패널 -->
    <div class="slider-panel">
      <!-- 속도 조절 -->
      <div class="slider-group">
        <div class="slider-header">
          <span>Tempo (속도)</span>
          <span class="val" id="speed-val">1.00x (100%)</span>
        </div>
        <input type="range" id="slider-speed" min="0.5" max="1.5" step="0.05" value="1.0">
        <button id="btn-reset-speed" class="secondary" style="margin-top: 6px; font-size: 0.75rem; padding: 3px 6px; align-self: flex-end;">속도 Reset</button>
      </div>

      <!-- 피치 및 영문 Key 표기 -->
      <div class="slider-group">
        <div class="slider-header">
          <span>Pitch (Key Shift)</span>
          <span class="val" id="pitch-val">0 Semitones</span>
        </div>
        
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
          <label style="font-size: 0.8rem; color: #ccc;">Original Key (원곡):</label>
          <select id="select-orig-key">
            <option value="0">C</option>
            <option value="1">C# / Db</option>
            <option value="2">D</option>
            <option value="3">D# / Eb</option>
            <option value="4">E</option>
            <option value="5">F</option>
            <option value="6">F# / Gb</option>
            <option value="7">G</option>
            <option value="8">G# / Ab</option>
            <option value="9" selected>A</option>
            <option value="10">A# / Bb</option>
            <option value="11">B</option>
          </select>
        </div>

        <input type="range" id="slider-pitch" min="-6" max="6" step="1" value="0">
        
        <div class="key-display-box">
          <div class="key-title">Target Key (조절된 키)</div>
          <div class="key-result" id="target-key-text">A (0 Semitones)</div>
        </div>

        <button id="btn-reset-pitch" class="secondary" style="margin-top: 6px; font-size: 0.75rem; padding: 3px 6px; align-self: flex-end;">키 Reset</button>
      </div>
    </div>
  </div>

  <script>
    const noteNames = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
    const mediaEl = document.getElementById('media-engine');
    const videoContainer = document.getElementById('video-container');
    const videoZoomPanel = document.getElementById('video-zoom-panel');

    const wsRegions = WaveSurfer.Regions.create();
    const wavesurfer = WaveSurfer.create({
      container: '#waveform',
      media: mediaEl,
      waveColor: '#4f5b66',
      progressColor: '#00f2fe',
      cursorColor: '#ff4b4b',
      cursorWidth: 2,
      height: 80,
      responsive: true,
      interact: true,
      plugins: [wsRegions]
    });

    wsRegions.enableDragSelection({ color: 'rgba(0, 242, 254, 0.3)' });

    let mediaSourceNode = null;
    let pitchShiftNode = null;
    let isReady = false;
    let activeRegion = null;

    const sliderSpeed = document.getElementById('slider-speed');
    const speedVal = document.getElementById('speed-val');
    const sliderPitch = document.getElementById('slider-pitch');
    const pitchVal = document.getElementById('pitch-val');
    const sliderZoom = document.getElementById('slider-zoom');
    const zoomVal = document.getElementById('zoom-val');
    const sliderVideoZoom = document.getElementById('slider-video-zoom');
    const videoZoomVal = document.getElementById('video-zoom-val');
    const selectOrigKey = document.getElementById('select-orig-key');
    const targetKeyText = document.getElementById('target-key-text');
    const btnPlay = document.getElementById('btn-play');
    const statusText = document.getElementById('status-text');

    async function ensureAudioPipeline() {
      if (Tone.context.state !== 'running') {
        await Tone.start();
      }

      if (!mediaSourceNode) {
        pitchShiftNode = new Tone.PitchShift(0);
        mediaSourceNode = Tone.getContext().createMediaElementSource(mediaEl);
        applyParams(); // 파이프라인 생성 즉시 스피커 노드 연결
      }
    }

    wsRegions.on('region-created', (region) => {
      wsRegions.getRegions().forEach((r) => { if (r !== region) r.remove(); });
      activeRegion = region;
      mediaEl.currentTime = region.start;
      if (mediaEl.paused) togglePlay();
      statusText.style.color = '#00f2fe';
      statusText.innerText = `구간 반복 설정 (${region.start.toFixed(2)}s ~ ${region.end.toFixed(2)}s)`;
    });

    // 파일 로딩 (HTML5 표준 이벤트 기반 안전 연결)
    document.getElementById('audio-file').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      statusText.style.color = '#00f2fe';
      statusText.innerText = `미디어 로딩 중: ${file.name}...`;
      isReady = false;

      mediaEl.pause();
      btnPlay.innerText = "재생 / 일시정지"; // 파일 선택 시 버튼 상태 확실하게 초기화
      wsRegions.clearRegions();
      activeRegion = null;

      const isVideo = file.type.startsWith('video/') || file.name.endsWith('.webm') || file.name.endsWith('.mp4');
      videoContainer.style.display = isVideo ? 'block' : 'none';
      videoZoomPanel.style.display = isVideo ? 'block' : 'none';

      const fileUrl = URL.createObjectURL(file);

      mediaEl.onloadedmetadata = () => {
        isReady = true;
        applyParams();
        statusText.style.color = '#00ff88';
        statusText.innerText = isVideo 
          ? '★ 동영상 로드 완료! [재생 / 일시정지] 버튼을 누르거나 파형을 드래그해보세요.' 
          : '★ 음원 로드 완료! [재생 / 일시정지] 버튼을 누르거나 파형을 드래그해보세요.';
      };

      mediaEl.onerror = () => {
        statusText.style.color = '#ff4b4b';
        statusText.innerText = '미디어 파일 읽기 오류가 발생했습니다.';
      };

      mediaEl.src = fileUrl;
      mediaEl.load();
    });

    mediaEl.addEventListener('timeupdate', () => {
      if (activeRegion && mediaEl.currentTime >= activeRegion.end) {
        mediaEl.currentTime = activeRegion.start;
      }
    });

    async function togglePlay() {
      if (!isReady) return alert('파일을 먼저 선택해 주세요.');

      try {
        await ensureAudioPipeline();
        applyParams(); // 재생 클릭 시 파이프라인 재확인 및 소리 직결

        if (mediaEl.paused) {
          await mediaEl.play();
          btnPlay.innerText = "일시정지";
        } else {
          mediaEl.pause();
          btnPlay.innerText = "재생 / 일시정지";
        }
      } catch (err) {
        console.error(err);
        alert('재생 처리 오류: ' + err.message);
      }
    }

    btnPlay.addEventListener('click', togglePlay);

    document.getElementById('btn-clear-loop').addEventListener('click', () => {
      wsRegions.clearRegions();
      activeRegion = null;
      statusText.innerText = '구간 반복이 해제되었습니다.';
    });

    // MP3 및 미디어 원음 HQ 음질 보장 파이프라인
    function applyParams() {
      const speed = parseFloat(sliderSpeed.value);
      const targetSemitones = parseInt(sliderPitch.value);
      const origKeyIdx = parseInt(selectOrigKey.value);

      if (mediaEl && mediaSourceNode) {
        mediaEl.playbackRate = speed;

        if (targetSemitones === 0) {
          mediaEl.preservesPitch = true;
          Tone.disconnect(mediaSourceNode);
          mediaSourceNode.connect(Tone.getContext().destination);
        } else {
          mediaEl.preservesPitch = false;
          Tone.disconnect(mediaSourceNode);
          Tone.connect(mediaSourceNode, pitchShiftNode);
          pitchShiftNode.toDestination();

          const speedPitchOffset = 12 * Math.log2(speed);
          pitchShiftNode.pitch = targetSemitones - speedPitchOffset;
        }
      }

      speedVal.innerText = `${speed.toFixed(2)}x (${Math.round(speed * 100)}%)`;
      const semitoneStr = targetSemitones > 0 ? `+${targetSemitones} Semitones` : `${targetSemitones} Semitones`;
      pitchVal.innerText = semitoneStr;

      let targetIdx = (origKeyIdx + targetSemitones) % 12;
      if (targetIdx < 0) targetIdx += 12;
      targetKeyText.innerText = `${noteNames[targetIdx]} (${semitoneStr})`;
    }

    // 영상 화면 확대 및 드래그 이동 (Video Zoom & Pan)
    let videoScale = 1.0;
    let panX = 0, panY = 0;
    let isDragging = false, startX = 0, startY = 0;

    function updateVideoTransform() {
      mediaEl.style.transform = `scale(${videoScale}) translate(${panX}px, ${panY}px)`;
    }

    sliderVideoZoom.addEventListener('input', (e) => {
      videoScale = parseFloat(e.target.value);
      if (videoScale === 1.0) { panX = 0; panY = 0; }
      videoZoomVal.innerText = `${videoScale.toFixed(1)}x`;
      updateVideoTransform();
    });

    videoContainer.addEventListener('mousedown', (e) => {
      if (videoScale > 1.0) {
        isDragging = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
      }
    });

    window.addEventListener('mousemove', (e) => {
      if (isDragging) {
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        updateVideoTransform();
      }
    });

    window.addEventListener('mouseup', () => { isDragging = false; });

    videoContainer.addEventListener('touchstart', (e) => {
      if (videoScale > 1.0 && e.touches.length === 1) {
        isDragging = true;
        startX = e.touches[0].clientX - panX;
        startY = e.touches[0].clientY - panY;
      }
    });

    window.addEventListener('touchmove', (e) => {
      if (isDragging && e.touches.length === 1) {
        panX = e.touches[0].clientX - startX;
        panY = e.touches[0].clientY - startY;
        updateVideoTransform();
      }
    });

    window.addEventListener('touchend', () => { isDragging = false; });

    sliderZoom.addEventListener('input', (e) => {
      const zoomPx = parseInt(e.target.value);
      wavesurfer.zoom(zoomPx);
      zoomVal.innerText = zoomPx === 0 ? '기본 크기' : `${zoomPx}px/sec (확대)`;
    });

    sliderSpeed.addEventListener('input', applyParams);
    sliderPitch.addEventListener('input', applyParams);
    selectOrigKey.addEventListener('change', applyParams);

    document.getElementById('btn-reset-speed').addEventListener('click', () => {
      sliderSpeed.value = 1.0;
      applyParams();
    });

    document.getElementById('btn-reset-pitch').addEventListener('click', () => {
      sliderPitch.value = 0;
      applyParams();
    });

    // ==========================================
    // 윈도우 화면 & 오디오 실시간 녹화 모듈
    // ==========================================
    let mediaRecorder = null, recordedChunks = [], recordStream = null;
    const btnRecord = document.getElementById('btn-record');

    btnRecord.addEventListener('click', async () => {
      if (mediaRecorder && mediaRecorder.state === "recording") {
        stopRecording();
      } else {
        await startRecording();
      }
    });

    async function startRecording() {
      try {
        recordStream = await navigator.mediaDevices.getDisplayMedia({
          video: { displaySurface: "window" },
          audio: true
        });

        if (recordStream.getAudioTracks().length === 0) {
          alert("⚠️ [주의] 오디오(소리) 공유가 켜지지 않았습니다!\n소리까지 함께 녹화하려면 화면 선택 팝업 하단의 '오디오 공유' 체크박스를 꼭 확인해 주세요.");
        }

        recordedChunks = [];
        const options = MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus') 
          ? { mimeType: 'video/webm;codecs=vp9,opus' } : { mimeType: 'video/webm' };

        mediaRecorder = new MediaRecorder(recordStream, options);
        mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };

        mediaRecorder.onstop = () => {
          const blob = new Blob(recordedChunks, { type: 'video/webm' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `copy_app_recording_${Date.now()}.webm`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);

          btnRecord.innerText = "🎥 영상 녹화 시작";
          btnRecord.style.background = "linear-gradient(to right, #ff007f, #7f00ff)";
          statusText.style.color = "#00f2fe";
          statusText.innerText = "녹화 영상이 저장되었습니다!";
        };

        recordStream.getVideoTracks()[0].onended = () => stopRecording();

        mediaRecorder.start(1000);
        btnRecord.innerText = "⏹️ 녹화 중지 및 저장";
        btnRecord.style.background = "#ff4b4b";
        statusText.style.color = "#ff007f";
        statusText.innerText = "⏺️ 화면 녹화 진행 중...";
      } catch (err) {
        if (err.name !== 'NotAllowedError') alert("녹화 시작 실패: " + err.message);
      }
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
      if (recordStream) recordStream.getTracks().forEach(track => track.stop());
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
    }
  </script>
</body>
</html>
