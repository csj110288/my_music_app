<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Musician Copy App</title>
  
  <!-- PWA Manifest & Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4facfe">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/461/461238.png">

  <!-- Wavesurfer.js & Regions Plugin -->
  <script src="https://unpkg.com/wavesurfer.js@7"></script>
  <script src="https://unpkg.com/wavesurfer.js@7/dist/plugins/regions.min.js"></script>

  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #121212; color: #ffffff; margin: 0; padding: 20px; text-align: center; }
    .container { max-width: 850px; margin: 0 auto; background: #1e1e1e; padding: 24px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    h1 { font-size: 1.6rem; color: #4facfe; margin-bottom: 20px; }
    
    .controls-main { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 20px; }
    
    .slider-panel {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
      background: #282828;
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 20px;
    }
    .slider-group { display: flex; flex-direction: column; align-items: stretch; text-align: left; }
    .slider-header { display: flex; justify-content: space-between; font-weight: bold; font-size: 0.95rem; margin-bottom: 8px; color: #4facfe; }
    .slider-header span.val { color: #00f2fe; }
    
    .key-display-box {
      background: #121212;
      border: 1px solid #4facfe;
      border-radius: 8px;
      padding: 10px;
      margin-top: 8px;
      text-align: center;
    }
    .key-title { font-size: 0.8rem; color: #aaa; margin-bottom: 4px; }
    .key-result { font-size: 1.2rem; font-weight: bold; color: #00f2fe; }

    select {
      background: #333; color: #fff; border: 1px solid #555; padding: 4px 8px; border-radius: 6px; font-weight: bold;
    }

    input[type="range"] {
      width: 100%; height: 6px; border-radius: 3px; background: #444; outline: none; accent-color: #00f2fe; cursor: pointer;
    }

    button, input[type="file"]::file-selector-button {
      background: linear-gradient(to right, #4facfe, #00f2fe);
      border: none; color: #000; font-weight: bold; padding: 10px 16px;
      border-radius: 8px; cursor: pointer; transition: 0.2s;
    }
    button.secondary { background: #333; color: #fff; border: 1px solid #555; }
    button:hover { opacity: 0.9; transform: translateY(-1px); }
    
    #waveform { background: #2a2a2a; border-radius: 8px; margin: 20px 0; min-height: 128px; }
    .status { font-size: 0.9rem; color: #aaa; margin-top: 10px; }
  </style>
</head>
<body>

  <div class="container">
    <h1>🎸 Musician Copy App (PWA)</h1>

    <div class="controls-main">
      <input type="file" id="audio-file" accept="audio/*,video/*">
      <button id="btn-play">재생 / 일시정지</button>
      <button id="btn-set-a">구간 시작 (A)</button>
      <button id="btn-set-b">구간 끝 (B)</button>
      <button id="btn-clear-loop" class="secondary">구간 해제</button>
    </div>

    <div class="slider-panel">
      <!-- 속도 조절 -->
      <div class="slider-group">
        <div class="slider-header">
          <span>Tempo (속도)</span>
          <span class="val" id="speed-val">1.00x (100%)</span>
        </div>
        <input type="range" id="slider-speed" min="0.5" max="1.5" step="0.05" value="1.0">
        <button id="btn-reset-speed" class="secondary" style="margin-top: 8px; font-size: 0.8rem; padding: 4px 8px; align-self: flex-end;">속도 Reset</button>
      </div>

      <!-- 피치 및 영문 Key 표기 -->
      <div class="slider-group">
        <div class="slider-header">
          <span>Pitch (Key Shift)</span>
          <span class="val" id="pitch-val">0 Semitones</span>
        </div>
        
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
          <label style="font-size: 0.85rem; color: #ccc;">Original Key (원곡):</label>
          <select id="select-orig-key">
            <option value="0">C</option>
            <option value="1">C# / Db</option>
            <option value="2">D</option>
            <option value="3">D# / Eb</option>
            <option value="4">E</option>
            <option value="5">F</option>
            <option value="6">F# / Gb</option>
            <option value="7">G</option>
            <option value="8">G# / Ab</option>
            <option value="9" selected>A</option>
            <option value="10">A# / Bb</option>
            <option value="11">B</option>
          </select>
        </div>

        <input type="range" id="slider-pitch" min="-6" max="6" step="1" value="0">
        
        <!-- 실시간 영문 음이름 결과 표시 상자 -->
        <div class="key-display-box">
          <div class="key-title">Target Key (조절된 키)</div>
          <div class="key-result" id="target-key-text">A (0 Semitones)</div>
        </div>

        <button id="btn-reset-pitch" class="secondary" style="margin-top: 8px; font-size: 0.8rem; padding: 4px 8px; align-self: flex-end;">키 Reset</button>
      </div>
    </div>

    <div id="waveform"></div>
    <div class="status" id="status-text">음원 또는 영상 파일(MP3, MP4 등)을 선택하세요.</div>
  </div>

  <script>
    // 영문 음이름 배열 (12반음)
    const noteNames = ["C", "C# / Db", "D", "D# / Eb", "E", "F", "F# / Gb", "G", "G# / Ab", "A", "A# / Bb", "B"];

    const wsRegions = WaveSurfer.Regions.create();
    const wavesurfer = WaveSurfer.create({
      container: '#waveform',
      waveColor: '#4f5b66',
      progressColor: '#00f2fe',
      cursorColor: '#ff4b4b',
      cursorWidth: 2,
      height: 128,
      responsive: true,
      plugins: [wsRegions]
    });

    let activeRegion = null;
    let loopA = 0;

    // 파일 열기
    document.getElementById('audio-file').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        document.getElementById('status-text').innerText = `Loading: ${file.name}...`;
        const url = URL.createObjectURL(file);
        wavesurfer.load(url);
      }
    });

    wavesurfer.on('ready', () => {
      document.getElementById('status-text').innerText = 'Ready! Play and adjust speed/pitch.';
      applySpeedAndPitch();
    });

    document.getElementById('btn-play').addEventListener('click', () => wavesurfer.playPause());

    // 구간 반복
    document.getElementById('btn-set-a').addEventListener('click', () => {
      loopA = wavesurfer.getCurrentTime();
      document.getElementById('status-text').innerText = `A-Point Set: ${loopA.toFixed(2)}s`;
    });

    document.getElementById('btn-set-b').addEventListener('click', () => {
      const loopB = wavesurfer.getCurrentTime();
      if (loopB <= loopA) return alert('B point must be after A point.');
      wsRegions.clearRegions();
      activeRegion = wsRegions.addRegion({
        start: loopA, end: loopB, color: 'rgba(0, 242, 254, 0.3)', drag: true, resize: true
      });
      wavesurfer.setTime(loopA);
      wavesurfer.play();
    });

    wsRegions.on('region-out', (region) => {
      if (region === activeRegion) {
        wavesurfer.setTime(region.start);
        wavesurfer.play();
      }
    });

    document.getElementById('btn-clear-loop').addEventListener('click', () => {
      wsRegions.clearRegions();
      activeRegion = null;
      document.getElementById('status-text').innerText = 'Loop cleared.';
    });

    // 컨트롤 슬라이더
    const sliderSpeed = document.getElementById('slider-speed');
    const speedVal = document.getElementById('speed-val');
    const sliderPitch = document.getElementById('slider-pitch');
    const pitchVal = document.getElementById('pitch-val');
    const selectOrigKey = document.getElementById('select-orig-key');
    const targetKeyText = document.getElementById('target-key-text');

    function applySpeedAndPitch() {
      const speed = parseFloat(sliderSpeed.value);
      const semitones = parseInt(sliderPitch.value);
      const origKeyIdx = parseInt(selectOrigKey.value);

      const mediaEl = wavesurfer.getMediaElement();
      if (mediaEl) mediaEl.preservesPitch = true;
      wavesurfer.setPlaybackRate(speed);

      if (mediaEl) {
        const pitchFactor = Math.pow(2, semitones / 12);
        mediaEl.playbackRate = speed * pitchFactor;
      }

      // 1. 속도 표시
      speedVal.innerText = `${speed.toFixed(2)}x (${Math.round(speed * 100)}%)`;

      // 2. 반음(Semitone) 표기
      const semitoneStr = semitones > 0 ? `+${semitones} Semitones` : `${semitones} Semitones`;
      pitchVal.innerText = semitoneStr;

      // 3. 영문 타겟 키 계산 (C, C#, D...)
      let targetIdx = (origKeyIdx + semitones) % 12;
      if (targetIdx < 0) targetIdx += 12;
      
      const targetNoteName = noteNames[targetIdx];
      targetKeyText.innerText = `${targetNoteName} (${semitoneStr})`;
    }

    sliderSpeed.addEventListener('input', applySpeedAndPitch);
    sliderPitch.addEventListener('input', applySpeedAndPitch);
    selectOrigKey.addEventListener('change', applySpeedAndPitch);

    document.getElementById('btn-reset-speed').addEventListener('click', () => {
      sliderSpeed.value = 1.0;
      applySpeedAndPitch();
    });

    document.getElementById('btn-reset-pitch').addEventListener('click', () => {
      sliderPitch.value = 0;
      applySpeedAndPitch();
    });

    // PWA Service Worker 등록
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('Service Worker Registered!', reg))
          .catch(err => console.log('Service Worker Registration Failed:', err));
      });
    }
  </script>
</body>
</html>
